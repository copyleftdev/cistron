name: release-plz

# Automated version bumping + publishing. On every merge to main, release-plz
# opens (or updates) a release PR that bumps the workspace version and the
# CHANGELOG from conventional-commit history; merging that PR tags the release
# and publishes the crates to crates.io. This is the mechanism that guarantees
# the version always bumps before a publish — crates.io also rejects any
# duplicate version as a backstop.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: run release-plz
        uses: release-plz/action@v0.5
        # Only open/refresh the release PR. Publishing to crates.io is enabled
        # later by adding the CARGO_REGISTRY_TOKEN secret and switching this to
        # `release-pr, release` (or adding a separate release job).
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
